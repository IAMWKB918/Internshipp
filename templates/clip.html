<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Visual Multi-Processor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 40px; }
        .container { max-width: 1000px; margin: auto; }
        .stage { background: #1a1a1a; height: 370px; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 2px solid #333; }
        .btn-orange { background: #fd7e14; color: white; margin-top: 15px; display: none; /* 初始隐藏 */}
        .btn-orange:hover { background: #e36a07; }
        /* 核心修复：确保图片在所有层级之上 */
        #current-img { 
            max-height: 85%; 
            max-width: 85%; 
            border-radius: 8px; 
            display: none; 
            object-fit: contain; 
            z-index: 5; /* 在背景之上 */
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        
        .scanner { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #00ff00; box-shadow: 0 0 15px #00ff00; display: none; animation: scan 2s infinite; z-index: 15; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        .controls { background: #222; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .task-item { display: flex; justify-content: space-between; background: #333; padding: 8px 12px; border-radius: 5px; margin-bottom: 5px; font-size: 13px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .btn-blue { background: #007bff; color: white; }
        .btn-purple { background: #6f42c1; color: white; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 15px; font-size: 18px; }
        
        .summary-header { background: #222; padding: 15px; border-radius: 10px 10px 0 0; border-left: 5px solid #28a745; margin-top: 30px; display: none; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; background: #222; padding: 15px; border-radius: 0 0 10px 10px; display: none; }
        .card { background: #333; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 4px solid #007bff; }
        #result-overlay { position:absolute; bottom:20px; background:rgba(0,0,0,0.85); padding:12px; border-radius:5px; display:none; z-index: 20; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 AI Multi-Input Classifier</h2>
        
        <div class="controls">
            <button onclick="addFolder()" class="btn btn-blue">➕ Add Folder</button>
            <button onclick="document.getElementById('file-input').click()" class="btn btn-purple">➕ Add Files</button>
            <input type="file" id="file-input" multiple style="display:none" onchange="addFiles(this)">
            
            <div style="margin-top:20px;">
                <b>Task Queue:</b>
                <div id="task-container" style="margin-top:10px;"><div style="color:#555;">Waiting for tasks...</div></div>
            </div>
            <button id="run-btn" onclick="runAll()" class="btn btn-green" style="display: none;">🔥 Start All Tasks</button>
            <button id="reset-btn" onclick="resetSystem()" class="btn btn-orange" style="width: 100%; font-size: 18px; padding: 10px;">🔄 Start New Batch / Refresh</button>

        </div>

        <div class="stage" id="stage">
            <div id="status-text">Idle</div>
            <div class="scanner" id="scanner"></div>
            <img id="current-img" src="" alt="AI Preview"> <!-- 这里的 z-index 保证它会遮住 "Idle" -->
            <div id="result-overlay"></div>
        </div>

        <div id="summary-header" class="summary-header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span><b>Path:</b> <i id="output-path-text"></i></span>
                <button onclick="openLocalFolder('root')" style="background:#28a745; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">📂 Main Folder</button>
            </div>
        </div>
        <div id="summary-area" class="summary-grid"></div>
    </div>

    <script>
        let taskQueue = [];

        async function addFolder() {
            const res = await fetch('/select_folder', {method: 'POST'});
            const data = await res.json();
            if(data.path) {
                taskQueue.push({ type: 'folder', path: data.path, name: data.path.split(/[\\/]/).pop() });
                renderTasks();
            }
        }

        async function addFiles(input) {
            if(input.files.length === 0) return;
            const formData = new FormData();
            for(let f of input.files) { formData.append('files[]', f); }
            const res = await fetch('/upload_temp', { method: 'POST', body: formData });
            const data = await res.json();
            data.paths.forEach(p => { taskQueue.push({ type: 'file', path: p, name: p.split(/[\\/]/).pop() }); });
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('task-container');
            container.innerHTML = taskQueue.length ? "" : '<div style="color:#555;">Waiting...</div>';
            taskQueue.forEach((t, idx) => {
                container.innerHTML += `<div class="task-item"><span><b>[${t.type.toUpperCase()}]</b> ${t.name}</span><span style="color:#ff4444;cursor:pointer" onclick="removeTask(${idx})">✖</span></div>`;
            });
            document.getElementById('run-btn').style.display = taskQueue.length > 0 ? 'block' : 'none';
        }

        function removeTask(idx) { taskQueue.splice(idx, 1); renderTasks(); }

        async function runAll() {
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = true;
            const statusText = document.getElementById('status-text');
            statusText.innerText = "Processing on AI Engine...";
            
            document.getElementById('summary-header').style.display = 'none';
            document.getElementById('summary-area').style.display = 'none';

            const res = await fetch('/run_tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tasks: taskQueue })
            });
            const data = await res.json();
            
            const imgElement = document.getElementById('current-img');
            const scanner = document.getElementById('scanner');
            const overlay = document.getElementById('result-overlay');

            statusText.style.display = 'none';
            imgElement.style.display = 'block'; 
            scanner.style.display = 'block';

            for (let item of data.logs) {
                // 1. 先切换图片 (强制刷新缓存)
                imgElement.src = item.thumb_url + "?t=" + new Date().getTime();
                overlay.style.display = 'block';
                overlay.innerHTML = `Analyzing: <span style="color:#aaa">${item.file}</span>`;
                
                // 2. 等待动画周期
                await new Promise(r => setTimeout(r, 1000));
                
                // 3. 显示结果
                overlay.innerHTML = `<b style="color:#00ff00">Result: ${item.result}</b> <span style="font-size:12px">(Confidence: ${item.score})</span>`;
                await new Promise(r => setTimeout(r, 500));
            }

            scanner.style.display = 'none';
            imgElement.style.display = 'none'; 
            statusText.style.display = 'block';
            statusText.innerText = "Batch Complete!";
            
            showSummary(data.summary, data.output_path);
            taskQueue = []; renderTasks();
            runBtn.disabled = false;

                runBtn.disabled = false;
                runBtn.style.display = 'none'; // 任务完成后隐藏“开始”按钮
                document.getElementById('reset-btn').style.display = 'block'; 

        }

        function showSummary(summary, outputPath) {
            document.getElementById('summary-header').style.display = 'block';
            document.getElementById('summary-area').style.display = 'grid';
            document.getElementById('output-path-text').innerText = outputPath;
            const area = document.getElementById('summary-area');
            area.innerHTML = "";
            for (let folder in summary) {
                area.innerHTML += `<div class="card"><p>${folder}</p><h3>${summary[folder]}</h3><button onclick="openLocalFolder('${folder}')">📂 View Files</button></div>`;
            }
        }
        async function openLocalFolder(name) { await fetch(`/open_folder/${name}`); }

        function resetSystem() {
    // 做法 1：直接刷新网页（最推荐，简单直接）
    window.location.reload();}

    </script>
</body>
</html>
