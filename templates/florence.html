<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Visual Multi-Processor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 40px; }
        .container { max-width: 1000px; margin: auto; }
        .stage { background: #1a1a1a; height: 370px; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 2px solid #333; }
        .btn-orange { background: #fd7e14; color: white; margin-top: 15px; display: none; /* 初始隐藏 */}
        .btn-orange:hover { background: #e36a07; }
        /* 核心修复：确保图片在所有层级之上 */
        #current-img { 
            max-height: 85%; 
            max-width: 85%; 
            border-radius: 8px; 
            display: none; 
            object-fit: contain; 
            z-index: 5; /* 在背景之上 */
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        
        .scanner { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #00ff00; box-shadow: 0 0 15px #00ff00; display: none; animation: scan 2s infinite; z-index: 15; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        .controls { background: #222; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .task-item { display: flex; justify-content: space-between; background: #333; padding: 8px 12px; border-radius: 5px; margin-bottom: 5px; font-size: 13px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .btn-blue { background: #007bff; color: white; }
        .btn-purple { background: #6f42c1; color: white; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 15px; font-size: 18px; }

        .error-box { background: #3a1f1f; border-left: 5px solid #dc3545; padding: 12px 15px; border-radius: 6px; margin-top: 15px; font-size: 13px; color: #ffb3b3; display: none; }

        .summary-area { display: none; }
        .batch-block { background: #1e1e1e; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .batch-header { background: #222; padding: 15px; border-left: 5px solid #28a745; display: flex; justify-content: space-between; align-items: center; }
        .batch-header .batch-name { font-weight: bold; font-size: 15px; }
        .batch-header .batch-path { font-size: 12px; color: #999; display: block; margin-top: 2px; }
        .batch-body { padding: 15px; }
        .year-block { background: #222; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .year-title { font-size: 18px; font-weight: bold; color: #ffc107; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #333; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 4px solid #007bff; }
        .card button { margin-top: 8px; background: #444; color: #ddd; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .card button:hover { background: #555; }
        #result-overlay { position:absolute; bottom:20px; background:rgba(0,0,0,0.85); padding:12px; border-radius:5px; display:none; z-index: 20; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚀 AI Multi-Input Classifier</h2>
        
        <div class="controls">
            <button onclick="addFolder()" class="btn btn-blue">➕ Add Folder</button>
            <button onclick="document.getElementById('file-input').click()" class="btn btn-purple">➕ Add Files</button>
            <input type="file" id="file-input" multiple style="display:none" onchange="addFiles(this)">
            
            <div style="margin-top:20px;">
                <b>Task Queue:</b>
                <div id="task-container" style="margin-top:10px;"><div style="color:#555;">Waiting for tasks...</div></div>
            </div>
            <button id="run-btn" onclick="runAll()" class="btn btn-green" style="display: none;">🔥 Start All Tasks</button>
            <button id="reset-btn" onclick="resetSystem()" class="btn btn-orange" style="width: 100%; font-size: 18px; padding: 10px;">🔄 Start New Batch / Refresh</button>

        </div>

        <div class="stage" id="stage">
            <div id="status-text">Idle</div>
            <div class="scanner" id="scanner"></div>
            <img id="current-img" src="" alt="AI Preview"> <!-- 这里的 z-index 保证它会遮住 "Idle" -->
            <div id="result-overlay"></div>
        </div>

        <div id="error-box" class="error-box"></div>

        <!-- 每个来源 (资料夹/上传文件) 各自完整跑一次，各自一个区块、各自的 output 路径 -->
        <div id="summary-area" class="summary-area"></div>
    </div>

    <script>
        let taskQueue = [];

        async function addFolder() {
            const res = await fetch('/select_folder', {method: 'POST'});
            const data = await res.json();
            if(data.path) {
                taskQueue.push({ type: 'folder', path: data.path, name: data.path.split(/[\\/]/).pop() });
                renderTasks();
            }
        }

        async function addFiles(input) {
            if(input.files.length === 0) return;
            const formData = new FormData();
            for(let f of input.files) { formData.append('files[]', f); }
            const res = await fetch('/upload_temp', { method: 'POST', body: formData });
            const data = await res.json();
            data.paths.forEach(p => { taskQueue.push({ type: 'file', path: p, name: p.split(/[\\/]/).pop() }); });
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('task-container');
            container.innerHTML = taskQueue.length ? "" : '<div style="color:#555;">Waiting...</div>';
            taskQueue.forEach((t, idx) => {
                container.innerHTML += `<div class="task-item"><span><b>[${t.type.toUpperCase()}]</b> ${t.name}</span><span style="color:#ff4444;cursor:pointer" onclick="removeTask(${idx})">✖</span></div>`;
            });
            document.getElementById('run-btn').style.display = taskQueue.length > 0 ? 'block' : 'none';
        }

        function removeTask(idx) { taskQueue.splice(idx, 1); renderTasks(); }

        async function runAll() {
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = true;
            const statusText = document.getElementById('status-text');
            statusText.innerText = "Processing on AI Engine... (each source runs separately, this can take a while)";

            document.getElementById('summary-area').style.display = 'none';
            document.getElementById('summary-area').innerHTML = '';
            document.getElementById('error-box').style.display = 'none';

            const res = await fetch('/run_tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tasks: taskQueue })
            });
            const data = await res.json();

            if (!res.ok) {
                statusText.innerText = "❌ " + (data.error || "处理失败，请看后台终端日志");
                runBtn.disabled = false;
                return;
            }

            const imgElement = document.getElementById('current-img');
            const scanner = document.getElementById('scanner');
            const overlay = document.getElementById('result-overlay');

            statusText.style.display = 'none';
            imgElement.style.display = 'block'; 
            scanner.style.display = 'block';

            for (let item of data.logs) {
                // 1. 先切换图片 (强制刷新缓存)
                imgElement.src = item.thumb_url + "?t=" + new Date().getTime();
                overlay.style.display = 'block';
                overlay.innerHTML = `Analyzing: <span style="color:#aaa">${item.file}</span>`;
                
                // 2. 等待动画周期
                await new Promise(r => setTimeout(r, 1000));
                
                // 3. 显示结果 (年份/分类)
                overlay.innerHTML = `<b style="color:#00ff00">Sorted into: ${item.result}</b>`;
                await new Promise(r => setTimeout(r, 500));
            }

            scanner.style.display = 'none';
            imgElement.style.display = 'none'; 
            statusText.style.display = 'block';
            statusText.innerText = "Batch Complete!";

            if (data.errors && data.errors.length) {
                const box = document.getElementById('error-box');
                box.style.display = 'block';
                box.innerHTML = "⚠️ 以下来源处理失败：<br>" + data.errors.join("<br>");
            }

            showBatches(data.batches || []);
            taskQueue = []; renderTasks();

            runBtn.disabled = false;
            runBtn.style.display = 'none'; // 任务完成后隐藏“开始”按钮
            document.getElementById('reset-btn').style.display = 'block';
        }

        // 每个来源 (资料夹) 各自跑完各自一个区块，各自的 output 路径、各自开资料夹
        function showBatches(batches) {
            const area = document.getElementById('summary-area');
            area.style.display = 'block';
            area.innerHTML = "";

            if (batches.length === 0) {
                area.innerHTML = `<div style="color:#888;padding:15px;">No files were sorted.</div>`;
                return;
            }

            for (const batch of batches) {
                const years = Object.keys(batch.summary).sort().reverse();

                let yearsHtml = "";
                if (years.length === 0) {
                    yearsHtml = `<div style="color:#888;padding:10px;">No files were sorted in this source.</div>`;
                } else {
                    for (const year of years) {
                        const categories = batch.summary[year];
                        const yearTotal = Object.values(categories).reduce((a, b) => a + b, 0);

                        let cardsHtml = "";
                        for (const category in categories) {
                            const count = categories[category];
                            cardsHtml += `
                                <div class="card">
                                    <p>${category}</p>
                                    <h3>${count}</h3>
                                    <button onclick="openLocalFolder(${batch.batch_index}, '${year}/${category}')">📂 View Files</button>
                                </div>`;
                        }

                        yearsHtml += `
                            <div class="year-block">
                                <div class="year-title">
                                    <span>📅 ${year}</span>
                                    <span style="font-size:13px;color:#aaa;">${yearTotal} photos</span>
                                </div>
                                <div class="summary-grid">${cardsHtml}</div>
                            </div>`;
                    }
                }

                area.innerHTML += `
                    <div class="batch-block">
                        <div class="batch-header">
                            <div>
                                <span class="batch-name">📁 ${batch.name}</span>
                                <span class="batch-path">${batch.output_path}</span>
                            </div>
                            <button onclick="openLocalFolder(${batch.batch_index}, 'root')" style="background:#28a745; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">📂 Main Folder</button>
                        </div>
                        <div class="batch-body">${yearsHtml}</div>
                    </div>`;
            }
        }

        async function openLocalFolder(batchIndex, target) { await fetch(`/open_folder/${batchIndex}/${target}`); }

        function resetSystem() {
    // 做法 1：直接刷新网页（最推荐，简单直接）
    window.location.reload();}

    </script>
</body>
</html>
