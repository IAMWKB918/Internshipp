<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Visual Multi-Processor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 40px; }
        .container { max-width: 1500px; margin: auto; }

        /* ---- 左右两栏：左边 multi-input classifier / 右边 auto cmsw ---- */
        .main-layout { display: flex; gap: 20px; align-items: flex-start; }
        .left-col { flex: 1.3; min-width: 0; }
        .right-col { flex: 1; min-width: 0; }
        /* 两栏标题现在都是直接摆在栏位最上面，没有任何外框/padding 垫着，
           给同样的 margin 就能真的对齐，不用再用一边的 margin 去凑另一边的框高。 */
        .left-col h2, .right-col h2 { margin: 0 0 15px; }
        .stage { background: #1a1a1a; height: 370px; border-radius: 15px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 2px solid #333; }
        .btn-orange { background: #fd7e14; color: white; margin-top: 15px; display: none; /* 初始隐藏 */}
        .btn-orange:hover { background: #e36a07; }
        /* 核心修复：确保图片在所有层级之上 */
        #current-img { 
            max-height: 85%; 
            max-width: 85%; 
            border-radius: 8px; 
            display: none; 
            object-fit: contain; 
            z-index: 5; /* 在背景之上 */
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }
        
        .scanner { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #00ff00; box-shadow: 0 0 15px #00ff00; display: none; animation: scan 2s infinite; z-index: 15; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        .controls { background: #222; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .task-item { display: flex; justify-content: space-between; background: #333; padding: 8px 12px; border-radius: 5px; margin-bottom: 5px; font-size: 13px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 10px; }
        .btn-blue { background: #007bff; color: white; }
        .btn-purple { background: #6f42c1; color: white; }
        .btn-green { background: #28a745; color: white; width: 100%; margin-top: 15px; font-size: 18px; }

        .error-box { background: #3a1f1f; border-left: 5px solid #dc3545; padding: 12px 15px; border-radius: 6px; margin-top: 15px; font-size: 13px; color: #ffb3b3; display: none; }

        .summary-area { display: none; }
        .batch-block { background: #1e1e1e; border-radius: 10px; margin-top: 20px; overflow: hidden; }
        .batch-header { background: #222; padding: 15px; border-left: 5px solid #28a745; display: flex; justify-content: space-between; align-items: center; }
        .batch-header .batch-name { font-weight: bold; font-size: 15px; }
        .batch-header .batch-path { font-size: 12px; color: #999; display: block; margin-top: 2px; }
        .batch-body { padding: 15px; }
        .year-block { background: #222; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .year-title { font-size: 18px; font-weight: bold; color: #ffc107; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #333; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 4px solid #007bff; }
        .card button { margin-top: 8px; background: #444; color: #ddd; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .card button:hover { background: #555; }
        /* ---- Add Folder (左上) / Stop (右上) 同一行 ---- */
        .controls-top-row { display: flex; justify-content: space-between; align-items: center; }
        .btn-red { background: #dc3545; color: white; margin-right: 0; }
        .btn-red:hover { background: #bb2d3b; }
        .btn-red:disabled { opacity: 0.5; cursor: not-allowed; }
        #stop-btn.is-stopped { background: #28a745; }
        #stop-btn.is-stopped:hover { background: #21883b; }

        /* ---- start analysis 之后取代 .controls 位置显示的状态文字 ---- */
        #classifier-status-msg { display:none; background:#222; padding:20px; border-radius:10px; margin-bottom:20px; text-align:center; color:#ccc; font-size:15px; }

        #reset-btn { margin-bottom: 20px; }

        #result-overlay { position:absolute; bottom:20px; background:rgba(0,0,0,0.85); padding:12px; border-radius:5px; display:none; z-index: 20; }

        /* ---- info generate 按钮：放在右栏 "Google Search" 标题右上角 ---- */
        .right-col-header { display:flex; justify-content:space-between; align-items:center; margin:0 0 15px; }
        .right-col-header h2 { margin:0; }
        #info-generate-btn { background:#6f42c1; color:white; display:none; padding:8px 14px; font-size:13px; }
        #info-generate-btn:hover { background:#5a349b; }

        /* ---- 点击 info generate 后，盖住左栏 (标题+controls+stage 3 块) 的遮罩：
           改成跟整个页面一样的深色调 (#121212/#1a1a1a/#1e1e1e/#222 这几种深灰混一起用
           渐层带过去，而不是纯 #000 死黑一块，看起来才像同一个页面的一部分)。
           里面放 Content Generate 的标题/说明/贴连结用的横线笔记本文字框。 ---- */
        #left-mask-screen {
            position:absolute; top:0; left:0; width:100%; height:130%;
            background: linear-gradient(160deg, #181818 0%, #1e1e1e 35%, #171717 65%, #202020 100%);
            display:none; align-items:flex-start; justify-content:center;
            z-index: 50; border-radius: 10px; padding: 30px 25px; box-sizing: border-box;
            overflow-y: auto;
        }
        .content-generate-panel { width:100%; }
        .content-generate-panel h2 { margin: 0 0 10px; }
        .content-generate-desc { color:#999; font-size:13px; margin: 0 0 15px; line-height:1.5; }

        /* A4 带横线笔记本风格的文字框，用来贴/输入参考连结 */
        .ruled-textarea {
            width: 100%; min-height: 260px; box-sizing: border-box;
            background-color: #1e1e1e;
            background-image: linear-gradient(#2c2c2c 1px, transparent 1px);
            background-size: 100% 28px;
            line-height: 28px;
            color: #e0e0e0;
            border: 1px solid #333; border-radius: 8px;
            padding: 4px 14px 0;
            font-family: 'Segoe UI', sans-serif; font-size: 14px;
            resize: vertical;
        }
        .ruled-textarea:focus { outline: none; border-color: #6f42c1; }
        .ruled-textarea::placeholder { color: #666; }

        /* ---- Content Generate: 状态文字 (跑中/失败) + 结果显示区 ---- */
        .cg-status { margin-top: 12px; font-size: 13px; color: #999; }
        .cg-status.running { color: #ffc107; }
        .cg-status.error { color: #ff8080; }

        .cg-result-block { background: #1e1e1e; border-radius: 10px; padding: 16px 18px; margin-top: 15px; }
        .cg-result-section { margin-bottom: 14px; }
        .cg-result-section:last-child { margin-bottom: 0; }
        .cg-result-label { font-size: 11.5px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .cg-result-zh { font-size: 14px; color: #eee; line-height: 1.5; }
        .cg-result-en { font-size: 13px; color: #aaa; line-height: 1.5; margin-top: 3px; font-style: italic; }
        .cg-result-meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .cg-result-meta-chip { background: #262626; border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #ddd; }
        .cg-result-meta-chip b { color: #6f42c1; }
        .cg-result-source { font-size: 12px; color: #4dabf7; word-break: break-all; }
        .cg-result-failed { font-size: 12px; color: #ff8080; margin-top: 10px; }

        /* ---- Stats row: Total / Classified / Missing ---- */
        .stats-row { display: flex; gap: 12px; margin-bottom: 15px; }
        .stat-box { flex: 1; background: #262626; border-radius: 8px; padding: 12px 15px; text-align: center; border-bottom: 4px solid #007bff; }
        .stat-box.good { border-bottom-color: #28a745; }
        .stat-box.warn { border-bottom-color: #dc3545; cursor: pointer; }
        .stat-box.warn:hover { background: #2e2020; }
        .stat-box.time { border-bottom-color: #6f42c1; }
        .stat-num { font-size: 26px; font-weight: bold; }
        .stat-label { font-size: 12px; color: #999; margin-top: 4px; }

        /* ---- Batch status variants: pending / running / error ---- */
        .pending-block { opacity: 0.5; }
        .running-header { border-left-color: #ffc107 !important; }
        .error-header { border-left-color: #dc3545 !important; }
        .pulse { display: inline-block; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* ---- Timing comparison chart (across folders) ---- */
        .timing-block { background: #1e1e1e; border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; }
        .timing-block h3 { margin: 0 0 12px; font-size: 15px; color: #ffc107; }

        /* ---- Missing files list (collapsed by default) ---- */
        .missing-list { display: none; background: #1a1414; border: 1px solid #442222; border-radius: 8px; padding: 10px 15px; margin-bottom: 15px; font-size: 12px; color: #ffb3b3; max-height: 180px; overflow-y: auto; }
        .missing-list.open { display: block; }
        .missing-list div { padding: 2px 0; }

        /* ---- Horizontal bar chart per category ---- */
        .chart-block { margin-bottom: 15px; }
        .chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
        .chart-label { width: 150px; flex-shrink: 0; color: #ddd; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chart-track { flex: 1; background: #2a2a2a; border-radius: 4px; height: 18px; position: relative; overflow: hidden; }
        .chart-fill { height: 100%; border-radius: 4px; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; box-sizing: border-box; transition: width 0.4s ease; }
        .chart-count { width: 40px; flex-shrink: 0; color: #aaa; font-size: 12px; }

        /* ══════════════════════════════════════════════════════
           右侧栏：auto_cmsw 分析结果面板。故意不整块包一层外框 ——
           左边也是标题(h2)在外面自由摆放，只有底下每个来源各自的区块
           (.batch-block / 这里的 .cmsw-block) 才有框，两边结构对齐，
           标题才会真的贴齐，不会因为右边多包了一层 border+padding 往下掉。
           ══════════════════════════════════════════════════════ */
        .cmsw-area { margin-top: 10px; }
        .cmsw-placeholder { color: #555; padding: 15px 0; }

        .cmsw-block { background: #1e1e1e; border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .cmsw-block.pending-block { opacity: 0.5; }
        .cmsw-header { background: #222; padding: 12px 15px; border-left: 5px solid #6f42c1; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .cmsw-header.running-header { border-left-color: #ffc107 !important; }
        .cmsw-header.error-header { border-left-color: #dc3545 !important; }
        .cmsw-name { font-weight: bold; font-size: 14px; }
        .cmsw-sub { font-size: 11.5px; color: #999; display: block; margin-top: 3px; }
        /* 找到几条 reference 的数字：有结果时放大、上鲜艳色，一眼就能看出这张卡片有没有料，
           故意不用红色 (红色在这个面板里是 error/missing 的颜色，会混淆) */
        .cmsw-total-num { font-size: 15px; font-weight: 800; color: #2dd4bf; margin: 0 2px; }
        .cmsw-body { padding: 14px 15px; }
        .cmsw-row { font-size: 13px; margin-bottom: 6px; color: #ccc; }
        .cmsw-row b { color: #ddd; font-weight: 600; }
        .cmsw-count-pill { display: inline-block; background: #262626; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #ddd; margin-top: 4px; margin-bottom: 8px; }
        .cmsw-result-item { background: #262626; border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 12.5px; }
        .cmsw-result-item a { color: #4dabf7; text-decoration: none; font-weight: 600; }
        .cmsw-result-item a:hover { text-decoration: underline; }
        .cmsw-result-snippet { color: #999; margin-top: 5px; line-height: 1.4; }
        .cmsw-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; background: #333; color: #aaa; margin-left: 6px; vertical-align: middle; }
        .cmsw-empty { color: #888; padding: 8px 0; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-layout">
            <!-- ══════════════ 左栏：原本的 Multi-Input Classifier ══════════════ -->
            <div class="left-col">
                <!-- title + controls + stage 包一层，方便 info-generate 的遮罩精准盖住这 3 块 -->
                <div id="left-mask-target" style="position:relative;">
                    <h2>🚀 AI Multi-Input Classifier</h2>

                    <div class="controls" id="controls-box">
                        <div class="controls-top-row">
                            <button onclick="addFolder()" class="btn btn-blue">➕ Add Folder</button>
                            <button id="stop-btn" onclick="stopClassifier()" class="btn btn-red" style="display: none;">⛔ Stop</button>
                        </div>
                        <div style="margin-top:20px;">
                            <b>Task Queue:</b>
                            <div id="task-container" style="margin-top:10px;"><div style="color:#555;">Waiting for tasks...</div></div>
                        </div>
                        <button id="run-btn" onclick="runAll()" class="btn btn-green" style="display: none;">🔥 Start All Tasks</button>
                    </div>

                    <!-- start analysis 之后取代上面 .controls 的位置：依 stopClassifier() 是否按过，显示不同文字 -->
                    <div id="classifier-status-msg"></div>

                    <button id="reset-btn" onclick="resetSystem()" class="btn btn-orange" style="width: 100%; font-size: 18px; padding: 10px;">🔄 Start New Batch / Refresh</button>

                    <div class="stage" id="stage">
                        <div id="status-text">Idle</div>
                        <div class="scanner" id="scanner"></div>
                        <img id="current-img" src="" alt="AI Preview"> <!-- 这里的 z-index 保证它会遮住 "Idle" -->
                        <div id="result-overlay"></div>
                    </div>

                    <div id="left-mask-screen">
                        <div class="content-generate-panel">
                            <h2>📝 Content Generate</h2>
                            <p class="content-generate-desc">Pull, or copy and paste the reference link to the box below.</p>
                            <textarea id="content-generate-link" class="ruled-textarea" placeholder="Paste reference link here..." oninput="onContentLinkInput()"></textarea>

                            <button id="content-generate-btn" class="btn btn-purple" style="display:none; margin-top:15px;" onclick="startContentGenerate()">🚀 Start Generate</button>

                            <div id="content-generate-status" class="cg-status" style="display:none;"></div>

                            <div id="content-generate-result" class="cg-result-block" style="display:none;"></div>
                        </div>
                    </div>
                </div>

                <div id="error-box" class="error-box"></div>

                <!-- 每个来源 (资料夹/上传文件) 各自完整跑一次，各自一个区块、各自的 output 路径 -->
                <div id="summary-area" class="summary-area"></div>
            </div>

            <!-- ══════════════ 右栏：auto_cmsw 分析结果 (分类 + 搜索 + 过滤) ══════════════ -->
            <!-- 一开始先藏起来，点了 Start All Tasks 才出现 —— 不然一进页面就看到一个空面板，太早了 -->
            <!-- 标题不包框，跟左边一样直接摆在栏位最上面，下面结果各自一个 .cmsw-block 卡片 -->
            <div class="right-col" id="right-col" style="display:none;">
                <div class="right-col-header">
                    <h2>🔎 Google Search</h2>
                    <button id="info-generate-btn" class="btn" onclick="toggleLeftMask()">info generate</button>
                </div>
                <div id="cmsw-area" class="cmsw-area">
                    <div class="cmsw-placeholder">Waiting for tasks...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let taskQueue = [];
        let classifierStopped = false;

        // 可以重复点：每点一次就在 停止 / 恢复 之间切换 —— 但这只在 Start 之前有意义
        // (决定这次要不要跑 classify)，一旦按下 Start，这颗按钮就跟着 controls-box
        // 一起藏起来了，不需要、也不支持跑到一半再切换。
        function stopClassifier() {
            classifierStopped = !classifierStopped;
            const stopBtn = document.getElementById('stop-btn');
            if (classifierStopped) {
                stopBtn.innerText = '▶ Resume';
                stopBtn.classList.add('is-stopped');
            } else {
                stopBtn.innerText = '⛔ Stop';
                stopBtn.classList.remove('is-stopped');
            }
        }

        async function addFolder() {
            const res = await fetch('/select_folder', {method: 'POST'});
            const data = await res.json();
            if(data.path) {
                taskQueue.push({ type: 'folder', path: data.path, name: data.path.split(/[\\/]/).pop() });
                renderTasks();
            }
        }

        function renderTasks() {
            const container = document.getElementById('task-container');
            container.innerHTML = taskQueue.length ? "" : '<div style="color:#555;">Waiting...</div>';
            taskQueue.forEach((t, idx) => {
                container.innerHTML += `<div class="task-item"><span><b>[${t.type.toUpperCase()}]</b> ${t.name}</span><span style="color:#ff4444;cursor:pointer" onclick="removeTask(${idx})">✖</span></div>`;
            });
            document.getElementById('run-btn').style.display = taskQueue.length > 0 ? 'block' : 'none';
            // Stop 按钮：检测到有 input folder 才显示，全部删掉又消失
            document.getElementById('stop-btn').style.display = taskQueue.length > 0 ? 'inline-block' : 'none';
        }

        function removeTask(idx) { taskQueue.splice(idx, 1); renderTasks(); }

        let pollTimer = null;
        let openMissingSet = new Set(); // 记住哪些 batch 的 missing 清单被展开过，轮询重绘时保留状态
        let openCmswSet = new Set(); // 记住哪些 batch 的 Google Search 详情被展开过，轮询重绘时保留状态
        let latestProgressData = null;

        // ---- 扫描动画排程：哪个 folder 先跑完，就先排队播哪个 folder 的动画 ----
        let animating = false;
        let animationQueue = [];
        let queuedBatchIndices = new Set();
        let animatedBatchIndices = new Set();

        async function runAll() {
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = true;
            const statusText = document.getElementById('status-text');
            statusText.style.display = 'block';
            statusText.innerText = "Starting…";

            // start analysis 之后，div.controls 整个不显示，改用下面这块状态文字取代它
            document.getElementById('controls-box').style.display = 'none';
            document.getElementById('reset-btn').style.display = 'none';
            const statusMsg = document.getElementById('classifier-status-msg');
            statusMsg.style.display = 'block';
            statusMsg.innerText = classifierStopped
                ? 'none of folder is pending for classify'
                : 'image is classifing … …';

            document.getElementById('current-img').style.display = 'none';
            document.getElementById('scanner').style.display = 'none';
            document.getElementById('result-overlay').style.display = 'none';
            document.getElementById('summary-area').style.display = 'none';
            document.getElementById('summary-area').innerHTML = '';
            document.getElementById('error-box').style.display = 'none';
            document.getElementById('right-col').style.display = 'block';
            document.getElementById('cmsw-area').innerHTML = '<div class="cmsw-placeholder">Starting…</div>';
            document.getElementById('info-generate-btn').style.display = 'inline-block';
            document.getElementById('left-mask-screen').style.display = 'none';
            openMissingSet = new Set();
            openCmswSet = new Set();
            animating = false;
            animationQueue = [];
            queuedBatchIndices = new Set();
            animatedBatchIndices = new Set();

            const res = await fetch('/run_tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ tasks: taskQueue, stopped: classifierStopped })
            });
            const data = await res.json();

            if (!res.ok) {
                statusText.innerText = "❌ " + (data.error || "处理失败，请看后台终端日志");
                runBtn.disabled = false;
                return;
            }

            taskQueue = []; renderTasks();

            // 不等 pipeline 全部跑完 —— 每个来源(folder)一跑完，轮询马上就会看到那批的结果
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollProgress, 1200);
            pollProgress();
        }

        async function pollProgress() {
            const res = await fetch('/progress');
            if (!res.ok) return;
            const data = await res.json();
            latestProgressData = data;
            renderProgress(data);
            maybeFinalize(data);
        }

        function maybeFinalize(data) {
            // 全部 folder 的资料都跑完了就可以收尾/显示 refresh —— 不用等 idle 那边的扫描动画播完，
            // 不然最后一个 folder 700 多张图片，动画播完才给 refresh，等太久了。
            if (!data.finished) return;

            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }

            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = false;
            runBtn.style.display = 'none'; // 任务完成后隐藏"开始"按钮
            document.getElementById('reset-btn').style.display = 'block';

            const wasStopped = classifierStopped;

            // status-text 还在播动画的话，animating 那边自己会管这个文字，这里不抢着改；
            // Stop 过的话，左边 stage 状态文字也不用管，专心显示 refresh 按钮就好
            if (!animating && !wasStopped) {
                document.getElementById('status-text').style.display = 'block';
                document.getElementById('status-text').innerText = "Batch Complete!";
            }

            // 这次 run 结束了：把 Stop 状态复位，下一轮预设是"没按过 stop"。
            classifierStopped = false;
            const stopBtn = document.getElementById('stop-btn');
            stopBtn.innerText = '⛔ Stop';
            stopBtn.classList.remove('is-stopped');

            if (data.errors && data.errors.length) {
                const box = document.getElementById('error-box');
                box.style.display = 'block';
                box.innerHTML = "⚠️ 以下来源处理失败：<br>" + data.errors.join("<br>");
            }
        }

        function formatDuration(sec) {
            sec = Math.round(sec || 0);
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m}m ${s}s` : `${s}s`;
        }

        // 某个 folder 一进入 done 状态，就把它的逐张图片 log 排进动画队列；
        // 队列按 folder 完成的先后顺序播放，播完一个接一个，不用等全部 folder 都跑完。
        function queueAnimationsFor(batches) {
            batches.forEach(b => {
                if (b.status === 'done' && !animatedBatchIndices.has(b.batch_index) && !queuedBatchIndices.has(b.batch_index)) {
                    queuedBatchIndices.add(b.batch_index);
                    animationQueue.push(b);
                }
            });
            if (!animating && animationQueue.length > 0) {
                processAnimationQueue();
            }
        }

        async function processAnimationQueue() {
            animating = true;
            const imgElement = document.getElementById('current-img');
            const scanner = document.getElementById('scanner');
            const overlay = document.getElementById('result-overlay');
            const statusText = document.getElementById('status-text');

            while (animationQueue.length > 0) {
                const batch = animationQueue.shift();
                const logs = batch.logs || [];

                statusText.style.display = 'none';
                scanner.style.display = 'block';
                overlay.style.display = 'block';

                for (const item of logs) {
                    // video/audio 没有缩略图，跳过设图，只显示文件名
                    if (item.thumb_url) {
                        imgElement.style.display = 'block';
                        imgElement.src = item.thumb_url + "?t=" + new Date().getTime();
                    } else {
                        imgElement.style.display = 'none';
                    }
                    overlay.innerHTML = `<span style="color:#888">[${batch.name}]</span> Analyzing: <span style="color:#aaa">${item.file}</span>`;
                    await new Promise(r => setTimeout(r, 1000));

                    overlay.innerHTML = `<b style="color:#00ff00">Sorted into: ${item.result}</b>`;
                    await new Promise(r => setTimeout(r, 500));
                }

                scanner.style.display = 'none';
                imgElement.style.display = 'none';
                overlay.style.display = 'none';
                animatedBatchIndices.add(batch.batch_index);
            }

            statusText.style.display = 'block';
            animating = false;
            if (latestProgressData) maybeFinalize(latestProgressData);
        }

        // 每个来源 (资料夹) 独立跑完各自一个区块，各自的 output 路径、各自开资料夹
        function categoryColor(idx) {
            // 用固定间隔的 hue 循环上色，类别数量不管多少都不会重复撞色
            return `hsl(${(idx * 47) % 360}, 60%, 50%)`;
        }

        // 轮询回来的整批数据 -> 排动画队列 + 重绘状态文字 + 时间比较图 + 每个 batch 卡片
        function renderProgress(data) {
            const batches = data.batches || [];

            // Stop 被按过：左边 classifier 全部不 function —— 不排扫描动画、不更新左边状态/卡片，
            // 只留 classifier-status-msg 那句 "none of folder is pending for classify"。
            // 右边 Google Search 不受影响，照样跑。
            if (classifierStopped) {
                renderCmswArea(batches);
                return;
            }

            queueAnimationsFor(batches);

            const doneOrError = batches.filter(b => b.status === 'done' || b.status === 'error').length;

            // 动画播放期间由 processAnimationQueue 自己控制 status-text/stage，轮询这里不要抢着改
            if (!animating) {
                const statusText = document.getElementById('status-text');
                statusText.style.display = 'block';
                statusText.innerText = data.finished
                    ? "Batch Complete!"
                    : `Processing… ${doneOrError}/${batches.length} folders done`;
            }

            // 全部 folder 的资料都跑完了，就把上面取代 .controls 的那句文字也更新掉，
            // 不用等 idle 那边的动画播完 —— 跟 refresh 按钮的出现时机对齐
            if (data.finished) {
                const statusMsg = document.getElementById('classifier-status-msg');
                if (statusMsg.style.display !== 'none') statusMsg.innerText = '✅ classification complete';
            }

            const area = document.getElementById('summary-area');
            area.style.display = 'block';

            if (batches.length === 0) {
                area.innerHTML = `<div style="color:#888;padding:15px;">No files were sorted.</div>`;
                return;
            }

            let html = renderTimingChart(batches);
            batches.forEach(batch => { html += renderBatchBlock(batch); });
            area.innerHTML = html;

            // 轮询会整个重绘，展开过的 missing 清单要还原状态，不然每次轮询都弹回收起
            openMissingSet.forEach(idx => {
                const el = document.getElementById(`missing-list-${idx}`);
                if (el) el.classList.add('open');
            });

            renderCmswArea(batches);
        }

        // ══════════════════════════════════════════════════════
        // 右栏：auto_cmsw 分析结果渲染 (分类 + 搜索 + 过滤)，跟左边同一份 batches 数据，
        // 每个 batch 多了一个 batch.cmsw 字段（app.py 那边 run_folder_analysis() 塞进去的）
        // ══════════════════════════════════════════════════════
        function renderCmswArea(batches) {
            const area = document.getElementById('cmsw-area');
            if (!area) return;

            if (batches.length === 0) {
                area.innerHTML = `<div class="cmsw-placeholder">Waiting for tasks...</div>`;
                return;
            }

            // 全部 batch 的 Google Search 都跑完了 (done 或 error，没有 pending/running 的了)
            // 才自动依 reference 数量从多到少排序 —— 还在跑的时候不排，不然卡片会一直跳动跑不稳
            const allCmswSettled = batches.every(b => {
                const st = b.cmsw_status || 'pending';
                return st === 'done' || st === 'error';
            });

            let orderedBatches = batches;
            if (allCmswSettled) {
                orderedBatches = [...batches].sort((a, b) => {
                    const countA = (a.cmsw && a.cmsw.kept) ? a.cmsw.kept.length : 0;
                    const countB = (b.cmsw && b.cmsw.kept) ? b.cmsw.kept.length : 0;
                    return countB - countA;
                });
            }

            let html = "";
            orderedBatches.forEach(batch => { html += renderCmswBlock(batch); });
            area.innerHTML = html;
        }

        // 展开/收纳单一 batch 的 Google Search 详情 (公司/组织、内容、结果清单)。
        // 只有真的有过滤后结果的卡片才有这颗按钮，见 renderCmswDone()。
        function toggleCmswDetail(batchIndex) {
            if (openCmswSet.has(batchIndex)) openCmswSet.delete(batchIndex);
            else openCmswSet.add(batchIndex);
            if (latestProgressData) renderCmswArea(latestProgressData.batches || []);
        }

        // auto_cmsw 跑得比左边的图片 pipeline 快很多 (top10 搜索 + 过滤，不用等图片归档)，
        // 所以这里完全看 batch.cmsw_status 自己的进度，不看 batch.status —— cmsw 一完成
        // 就马上显示结果，不用等左边那个 folder 的图片全部分类完。
        function renderCmswBlock(batch) {
            const cmswStatus = batch.cmsw_status || 'pending';

            if (cmswStatus === 'pending') {
                return `
                    <div class="cmsw-block pending-block">
                        <div class="cmsw-header">
                            <span class="cmsw-name">⏳ ${batch.name}</span>
                            <span class="cmsw-sub">Waiting to start…</span>
                        </div>
                    </div>`;
            }
            if (cmswStatus === 'running') {
                return `
                    <div class="cmsw-block">
                        <div class="cmsw-header running-header">
                            <span class="cmsw-name pulse">⚙️ ${batch.name}</span>
                            <span class="cmsw-sub">Analyzing… ${formatDuration(batch.cmsw_elapsed_seconds)} elapsed</span>
                        </div>
                    </div>`;
            }
            if (cmswStatus === 'error') {
                const msg = (batch.cmsw && batch.cmsw.error) || 'Analysis failed';
                return `
                    <div class="cmsw-block">
                        <div class="cmsw-header error-header">
                            <span class="cmsw-name">❌ ${batch.name}</span>
                            <span class="cmsw-sub">${msg}</span>
                        </div>
                    </div>`;
            }

            // done
            const cmsw = batch.cmsw;
            if (!cmsw) {
                return `
                    <div class="cmsw-block">
                        <div class="cmsw-header">
                            <span class="cmsw-name">${batch.name}</span>
                            <span class="cmsw-sub">No CMSW data yet</span>
                        </div>
                    </div>`;
            }
            return renderCmswDone(batch.name, batch.batch_index, cmsw);
        }

        function renderCmswDone(name, batchIndex, cmsw) {
            const kept = cmsw.kept || [];
            const hasResults = kept.length > 0;
            const dateCategory = [cmsw.date_str || '', cmsw.category || ''].filter(Boolean).join(' · ');

            // 没有 reference / file location 的：不值得占空间，只留一行标题 + total : 0 result，
            // 不显示 公司/组织、内容 这些，也不给收纳按钮 (反正没东西好收纳/展开)。
            if (!hasResults) {
                const emptyMsg = cmsw.search_error ? `⚠ ${cmsw.search_error}` : 'total : 0 result';
                return `
                    <div class="cmsw-block">
                        <div class="cmsw-header">
                            <div>
                                <span class="cmsw-name">✅ ${name}</span>
                                <span class="cmsw-sub">${dateCategory}${dateCategory ? ' · ' : ''}${emptyMsg}</span>
                            </div>
                        </div>
                    </div>`;
            }

            const isOpen = openCmswSet.has(batchIndex);

            const resultsHtml = kept.map(r => `
                <div class="cmsw-result-item">
                    <a href="${r.url}" target="_blank" rel="noopener">${r.title || r.url}</a>
                    <span class="cmsw-badge">${r.matched_filter || '?'}${r.matched_date ? ' · ' + r.matched_date : ''}</span>
                    ${r.snippet ? `<div class="cmsw-result-snippet">${r.snippet}</div>` : ''}
                </div>`).join("");

            // 过滤完还有剩下的结果，才值得点进去看存盘位置；全被过滤掉就没有档案好开了
            const openBtnHtml = `<button onclick="openCmswFolder(${batchIndex})" style="background:#6f42c1; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; flex-shrink:0;">📂 File Location</button>`;
            const toggleBtnHtml = `<button onclick="toggleCmswDetail(${batchIndex})" style="background:#333; color:#ddd; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; flex-shrink:0;">${isOpen ? '▲ Collapse' : '▼ Expand'}</button>`;

            // 收纳状态下 (isOpen === false)：只留标题那一行 (含 total 数)，公司/组织、内容、
            // 结果清单这些通通不渲染，才不会占空间；展开了才把 .cmsw-body 整块画出来。
            const bodyHtml = isOpen ? `
                    <div class="cmsw-body">
                        <div class="cmsw-row"><b>公司/组织：</b>${cmsw.company || '(无，用了硬性条件)'}</div>
                        <div class="cmsw-row"><b>内容：</b>${cmsw.content || '(无)'}</div>
                        <div class="cmsw-count-pill">🔍 ${cmsw.total_after_filter} / ${cmsw.total_before_filter} 条通过过滤</div>
                        ${resultsHtml}
                    </div>` : '';

            return `
                <div class="cmsw-block">
                    <div class="cmsw-header">
                        <div>
                            <span class="cmsw-name">✅ ${name}</span>
                            <span class="cmsw-sub">${dateCategory}${dateCategory ? ' · ' : ''}total : <span class="cmsw-total-num">${kept.length}</span> result</span>
                        </div>
                        <div style="display:flex; gap:8px; flex-shrink:0;">
                            ${toggleBtnHtml}
                            ${openBtnHtml}
                        </div>
                    </div>
                    ${bodyHtml}
                </div>`;
        }

        async function openCmswFolder(batchIndex) { await fetch(`/open_cmsw_folder/${batchIndex}`); }

        // 跨 folder 的处理时间比较 —— 只要有 batch 开始跑(running 或 done)就会出现，实时更新
        function renderTimingChart(batches) {
            const withTime = batches.filter(b => (b.status === 'running' || b.status === 'done' || b.status === 'error') && b.elapsed_seconds);
            if (withTime.length === 0) return "";

            const maxT = Math.max(...withTime.map(b => b.elapsed_seconds));
            let rows = "";
            withTime.forEach((b, idx) => {
                const pct = maxT ? Math.round((b.elapsed_seconds / maxT) * 100) : 0;
                rows += `
                    <div class="chart-row">
                        <div class="chart-label">${b.name}</div>
                        <div class="chart-track">
                            <div class="chart-fill" style="width:${pct}%; background:${categoryColor(idx)};"></div>
                        </div>
                        <div class="chart-count">${formatDuration(b.elapsed_seconds)}</div>
                    </div>`;
            });
            return `<div class="timing-block"><h3>⏱ Processing Time by Folder</h3>${rows}</div>`;
        }

        // 依 batch 目前状态 (pending / running / error / done) 分流渲染
        function renderBatchBlock(batch) {
            if (batch.status === 'pending') {
                return `
                    <div class="batch-block pending-block">
                        <div class="batch-header">
                            <div>
                                <span class="batch-name">⏳ ${batch.name}</span>
                                <span class="batch-path">Waiting to start…</span>
                            </div>
                        </div>
                    </div>`;
            }
            if (batch.status === 'running') {
                return `
                    <div class="batch-block">
                        <div class="batch-header running-header">
                            <div>
                                <span class="batch-name pulse">⚙️ ${batch.name}</span>
                                <span class="batch-path">Processing… ${formatDuration(batch.elapsed_seconds)} elapsed</span>
                            </div>
                        </div>
                    </div>`;
            }
            if (batch.status === 'error') {
                return `
                    <div class="batch-block">
                        <div class="batch-header error-header">
                            <div>
                                <span class="batch-name">❌ ${batch.name}</span>
                                <span class="batch-path">${batch.error_message || 'Failed'} · ${formatDuration(batch.elapsed_seconds)}</span>
                            </div>
                        </div>
                    </div>`;
            }
            return renderDoneBatch(batch);
        }

        function renderDoneBatch(batch) {
            const categories = batch.summary || {};
            const catNames = Object.keys(categories).sort((a, b) => categories[b] - categories[a]);
            const total = batch.total ?? 0;
            const classified = batch.classified ?? 0;
            const missing = batch.missing ?? Math.max(0, total - classified);
            const missingFiles = batch.missing_files || [];
            const maxCount = catNames.length ? categories[catNames[0]] : 0;

            let cardsHtml = "";
            let chartHtml = "";
            if (catNames.length === 0) {
                chartHtml = `<div style="color:#888;padding:10px;">No files were sorted in this source.</div>`;
            } else {
                catNames.forEach((category, idx) => {
                    const count = categories[category];
                    const pct = maxCount ? Math.round((count / maxCount) * 100) : 0;
                    const color = categoryColor(idx);

                    chartHtml += `
                        <div class="chart-row">
                            <div class="chart-label">${category}</div>
                            <div class="chart-track">
                                <div class="chart-fill" style="width:${pct}%; background:${color};"></div>
                            </div>
                            <div class="chart-count">${count}</div>
                        </div>`;

                    cardsHtml += `
                        <div class="card" style="border-bottom-color:${color};">
                            <p>${category}</p>
                            <h3>${count}</h3>
                            <button onclick="openLocalFolder(${batch.batch_index}, '${category}')">📂 View Files</button>
                        </div>`;
                });
            }

            const missingListId = `missing-list-${batch.batch_index}`;
            const missingHtml = missingFiles.length
                ? missingFiles.map(f => `<div>⚠️ ${f}</div>`).join("")
                : `<div style="color:#888;">No missing files.</div>`;

            return `
                <div class="batch-block">
                    <div class="batch-header">
                        <div>
                            <span class="batch-name">✅ ${batch.name}</span>
                            <span class="batch-path">${batch.output_path || ''}</span>
                        </div>
                        <button onclick="openLocalFolder(${batch.batch_index}, 'root')" style="background:#28a745; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">📂 Main Folder</button>
                    </div>
                    <div class="batch-body">
                        <div class="stats-row">
                            <div class="stat-box">
                                <div class="stat-num">${total}</div>
                                <div class="stat-label">Total Files</div>
                            </div>
                            <div class="stat-box good">
                                <div class="stat-num">${classified}</div>
                                <div class="stat-label">Classified</div>
                            </div>
                            <div class="stat-box ${missing > 0 ? 'warn' : ''}" ${missing > 0 ? `onclick="toggleMissing('${missingListId}', ${batch.batch_index})"` : ''}>
                                <div class="stat-num">${missing}</div>
                                <div class="stat-label">Missing ${missing > 0 ? '(click to view)' : ''}</div>
                            </div>
                            <div class="stat-box time">
                                <div class="stat-num">${formatDuration(batch.elapsed_seconds)}</div>
                                <div class="stat-label">Time Taken</div>
                            </div>
                        </div>
                        <div id="${missingListId}" class="missing-list">${missingHtml}</div>
                        <div class="chart-block">${chartHtml}</div>
                        <div class="summary-grid">${cardsHtml}</div>
                    </div>
                </div>`;
        }

        function toggleMissing(id, batchIndex) {
            document.getElementById(id).classList.toggle('open');
            if (openMissingSet.has(batchIndex)) openMissingSet.delete(batchIndex);
            else openMissingSet.add(batchIndex);
        }

        async function openLocalFolder(batchIndex, target) { await fetch(`/open_folder/${batchIndex}/${target}`); }

        function toggleLeftMask() {
            const mask = document.getElementById('left-mask-screen');
            mask.style.display = (mask.style.display === 'flex') ? 'none' : 'flex';
        }

        // ══════════════════════════════════════════════════════
        // Content Generate: 贴/输入连结 -> 侦测到至少一条 http(s) 连结才让
        // "Start Generate" 按钮出现 -> 按下去交给后端 auto_report 那套流程
        // (抓网页内容 -> Ollama 中文抽取 -> 翻英文) -> 结果显示在下面这块区域。
        // 存盘位置先不管，这里先专心把生成出来的句子显示出来。
        // ══════════════════════════════════════════════════════
        const CG_LINK_PATTERN = /https?:\/\/[^\s]+/;
        let cgGenerating = false;

        function onContentLinkInput() {
            if (cgGenerating) return; // 跑的时候不要让按钮因为文字框变动又跳出来
            const text = document.getElementById('content-generate-link').value;
            const btn = document.getElementById('content-generate-btn');
            btn.style.display = CG_LINK_PATTERN.test(text) ? 'inline-block' : 'none';
        }

        async function startContentGenerate() {
            const text = document.getElementById('content-generate-link').value;
            if (!CG_LINK_PATTERN.test(text)) return;

            const btn = document.getElementById('content-generate-btn');
            const statusEl = document.getElementById('content-generate-status');
            const resultEl = document.getElementById('content-generate-result');

            cgGenerating = true;
            btn.disabled = true;
            btn.style.display = 'none';
            resultEl.style.display = 'none';
            resultEl.innerHTML = '';
            statusEl.style.display = 'block';
            statusEl.className = 'cg-status running';
            statusEl.innerText = '⏳ Generating… fetching sources and running the model, this can take a bit.';

            try {
                const res = await fetch('/generate_content', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ links_text: text }),
                });
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    statusEl.className = 'cg-status error';
                    statusEl.innerText = `❌ ${data.error || 'Generate failed.'}`;
                } else {
                    statusEl.style.display = 'none';
                    renderContentGenerateResult(data.data, data.failed_links || []);
                }
            } catch (e) {
                statusEl.className = 'cg-status error';
                statusEl.innerText = `❌ ${e.message || 'Generate failed.'}`;
            } finally {
                cgGenerating = false;
                btn.disabled = false;
                onContentLinkInput(); // 跑完了，看文字框现在的内容决定按钮要不要再出现
            }
        }

        function renderContentGenerateResult(data, failedLinks) {
            const resultEl = document.getElementById('content-generate-result');
            if (!data) {
                resultEl.style.display = 'none';
                return;
            }

            const section = (label, zh, en) => `
                <div class="cg-result-section">
                    <div class="cg-result-label">${label}</div>
                    <div class="cg-result-zh">${zh || '(无)'}</div>
                    ${en ? `<div class="cg-result-en">${en}</div>` : ''}
                </div>`;

            const metaRow = `
                <div class="cg-result-meta-row">
                    <span class="cg-result-meta-chip"><b>Category</b> ${data.category || '-'}</span>
                    <span class="cg-result-meta-chip"><b>Year</b> ${data.related_year || '-'}</span>
                    <span class="cg-result-meta-chip"><b>Date</b> ${data.acquisition_date || '-'}</span>
                </div>`;

            const failedHtml = failedLinks.length
                ? `<div class="cg-result-failed">⚠ ${failedLinks.length} link(s) could not be fetched: ${failedLinks.join(', ')}</div>`
                : '';

            resultEl.innerHTML = `
                ${metaRow}
                ${section('Name', data.name_zh, data.name_en)}
                ${section('Description', data.description_zh, data.description_en)}
                ${section('Accomplishment', data.accomplishment_zh, data.accomplishment_en)}
                ${section('Country', data.country_zh, data.country_en)}
                ${section('Related Industry', data.related_industry_zh, data.related_industry_en)}
                <div class="cg-result-section">
                    <div class="cg-result-label">Additional Source</div>
                    <div class="cg-result-source">${data.additional_source || '(无)'}</div>
                </div>
                ${failedHtml}
            `;
            resultEl.style.display = 'block';
        }

        function resetSystem() {
    // 做法 1：直接刷新网页（最推荐，简单直接）
    window.location.reload();}

    </script>
</body>
</html>
